<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 330" role="img" aria-label="How it works: 1, you upload your packs, built with ba-package, to App Store Connect or your own server. 2, people install your app. 3, iOS downloads the packs in the background, with the downloader extension. 4, your app uses the files with pathForFile. Your app can also ask for a pack on demand." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f93"/></marker><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker></defs>
<rect x="15" y="15" width="230" height="220" rx="14" fill="#1f2733" stroke="#334154"/>
<circle cx="37" cy="37" r="11" fill="#58a6ff"/>
<text x="37" y="41.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<circle cx="130.0" cy="77" r="30" fill="#1d3354"/>
<g transform="translate(113.2 60.2) scale(1.4)" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/>
<path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/>
</g>
<text x="130.0" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#e8eef5">You upload your packs</text>
<text x="130.0" y="165" text-anchor="middle" font-size="12.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">ba-package</text>
<text x="130.0" y="184" text-anchor="middle" font-size="13" fill="#a9b6c5">to App Store Connect</text>
<text x="130.0" y="203" text-anchor="middle" font-size="13" fill="#a9b6c5">or your own server</text>
<path d="M251 77H279" stroke="#6f7f93" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="285" y="15" width="230" height="220" rx="14" fill="#1f2733" stroke="#334154"/>
<circle cx="307" cy="37" r="11" fill="#58a6ff"/>
<text x="307" y="41.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<circle cx="400.0" cy="77" r="30" fill="#1d3354"/>
<g transform="translate(383.2 60.2) scale(1.4)" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/>
<path d="M10.5 18.5h3"/>
</g>
<text x="400.0" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#e8eef5">People install your app</text>
<text x="400.0" y="165" text-anchor="middle" font-size="13" fill="#a9b6c5">From the App Store</text>
<text x="400.0" y="184" text-anchor="middle" font-size="13" fill="#a9b6c5">or TestFlight</text>
<path d="M521 77H549" stroke="#6f7f93" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="555" y="15" width="230" height="220" rx="14" fill="#1f2733" stroke="#334154"/>
<circle cx="577" cy="37" r="11" fill="#58a6ff"/>
<text x="577" y="41.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<circle cx="670.0" cy="77" r="30" fill="#1d3354"/>
<g transform="translate(653.2 60.2) scale(1.4)" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<path d="M7 17.5H6a4 4 0 0 1-.6-7.95A6 6 0 0 1 17.2 8.1 4.5 4.5 0 0 1 18 17.5h-1"/>
<path d="M12 11v9M8.8 16.8 12 20l3.2-3.2"/>
</g>
<text x="670.0" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#e8eef5">iOS downloads the packs</text>
<text x="670.0" y="165" text-anchor="middle" font-size="13" fill="#a9b6c5">In the background, with the</text>
<text x="670.0" y="184" text-anchor="middle" font-size="13" fill="#a9b6c5">downloader extension</text>
<path d="M791 77H819" stroke="#6f7f93" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="825" y="15" width="230" height="220" rx="14" fill="#1f2733" stroke="#334154"/>
<circle cx="847" cy="37" r="11" fill="#58a6ff"/>
<text x="847" y="41.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<circle cx="940.0" cy="77" r="30" fill="#1d3354"/>
<g transform="translate(923.2 60.2) scale(1.4)" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="4.5" width="18" height="15" rx="2"/>
<circle cx="8.5" cy="9.5" r="1.6"/>
<path d="M21 15.5l-5-5-9 9"/>
</g>
<text x="940.0" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#e8eef5">Your app uses the files</text>
<text x="940.0" y="165" text-anchor="middle" font-size="12.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">pathForFile</text>
<text x="940.0" y="184" text-anchor="middle" font-size="12.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">display.newImage</text>
<text x="940.0" y="203" text-anchor="middle" font-size="12.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">audio.loadSound</text>
<path d="M940.0 239V279H670.0V245" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#al)"/>
<text x="805.0" y="301" text-anchor="middle" font-size="13" fill="#58a6ff">asks for a pack on demand</text>
<text x="805.0" y="320" text-anchor="middle" font-size="12.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#98a6b6">ensureLocalAvailability</text>
</svg>
